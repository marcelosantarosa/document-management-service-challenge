services:
  postgresql:
    container_name: postgresql_container
    image: bitnami/postgresql:latest
    ports:
      - "5432:5432"
    networks:
      - batch_network
    volumes:
      - challenge_postgresql_data:/bitnami/postgresql
      - ./init-scripts:/docker-entrypoint-initdb.d
    environment:
      - POSTGRESQL_USERNAME=clara
      - POSTGRESQL_PASSWORD=admin123
      - POSTGRESQL_DATABASE=challenge
      - POSTGRESQL_POSTGRES_PASSWORD=admin123 # Password of user "postgres"
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    ports:
      - "9000:9000"  # API S3
      - "9001:9001"  # MinIO Web Console
    networks:
      - batch_network
    environment:
      MINIO_ROOT_USER: clara
      MINIO_ROOT_PASSWORD: admin123
    command: server --console-address ":9001" /data
    volumes:
      - challenge_minio_data:/data
  document-management-service:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: document-management-service
    ports:
      - "8080:8080"
    networks:
      - batch_network
    depends_on:
      - postgresql
      - minio
    environment:
      - JAVA_OPTS=-Xmx50m -Xms50m
      - DB_HOST=postgresql
      - DB_USERNAME=clara
      - DB_PASSWORD=admin123
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=clara
      - MINIO_SECRET_KEY=admin123
      - MINIO_BUCKET_NAME=document-bucket
    deploy:
      resources:
        limits:
          memory: 200M

volumes:
  challenge_postgresql_data:
    driver: local
  challenge_minio_data:
    driver: local

networks:
  batch_network:
    driver: bridge
